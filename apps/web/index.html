<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- The favicon is imported from @taverns/design-system in src/main.tsx. -->
    <link rel="icon" type="image/png" />
    <title>Tiny Taverns</title>

    <!--
      Instrument Sans and JetBrains Mono ship no local binaries, so they load
      non-blocking from Google Fonts exactly as tokens/fonts.css documents. Every
      --font-* token carries a real system fallback, so an offline page still reads.
      Alegreya is self-hosted and comes in through the design-system CSS.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
