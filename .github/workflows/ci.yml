name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request cancels its older run; every main push runs to
# the end, so back-to-back merges each keep their own verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turbo's local cache is kept between runs, one per job, so a task whose inputs
# have not changed replays its logs and outputs instead of running. A save is
# keyed by commit and a run restores the newest save for the same lockfile.
# `server#test` is never cached (turbo.json): its result depends on the
# database. Entries a week old are dropped so a restore stays small; a task
# that still hits them simply runs once and is saved again.
env:
  TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache

# One job per suite, each on its own runner. Run together on one 4-vCPU runner,
# the web and server suites contended for the same cores, and that contention
# is what pushed their timing-sensitive tests past their budgets.
jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo's cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Drop cache entries older than a week
        run: find "$TURBO_CACHE_DIR" -type f -mtime +7 -delete 2>/dev/null || true

      - name: Lint, typecheck, build
        run: pnpm turbo run lint typecheck build

      # oxfmt is a root-only script, not a turbo task — so it has to be named
      # here or nothing checks it. It was not, and six files had drifted.
      - name: Check formatting
        run: pnpm format:check

  # The server's repository and migration tests run against a real Postgres —
  # the schema is Postgres dialect, and they fail loudly rather than skipping
  # when it is missing. The suite refuses to run without DATABASE_URL, and
  # turbo passes it through to `test` (turbo.json), so it is named here.
  server-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://taverns:taverns@127.0.0.1:5433/taverns

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taverns
          POSTGRES_PASSWORD: taverns
          POSTGRES_DB: taverns
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taverns -d taverns"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo's cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Drop cache entries older than a week
        run: find "$TURBO_CACHE_DIR" -type f -mtime +7 -delete 2>/dev/null || true

      - name: Test the server
        run: pnpm turbo run test --filter=server

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo's cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Drop cache entries older than a week
        run: find "$TURBO_CACHE_DIR" -type f -mtime +7 -delete 2>/dev/null || true

      - name: Test the web app and the shared packages
        run: pnpm turbo run test --filter=web --filter=@taverns/ui --filter=@taverns/api

      # Vitest's Vite start regenerates the route tree from `src/routes/`; a
      # committed tree that differs from it is stale (`apps/web/src/router.ts`).
      - name: Check the route tree is current
        run: git diff --exit-code apps/web/src/routeTree.gen.ts
