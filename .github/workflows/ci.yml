name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request cancels its older run; every main push runs to
# the end, so back-to-back merges each keep their own verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job per suite, each on its own runner. Run together on one 4-vCPU runner,
# the web and server suites contended for the same cores, and that contention
# is what pushed their timing-sensitive tests past their budgets.
jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build
        run: pnpm turbo run lint typecheck build

      # Prettier is a root-only script, not a turbo task — so it has to be named
      # here or nothing checks it. It was not, and six files had drifted.
      - name: Check formatting
        run: pnpm format:check

  # The server's repository and migration tests run against a real Postgres —
  # the schema is Postgres dialect, and they fail loudly rather than skipping
  # when it is missing. The suite refuses to run without DATABASE_URL, and
  # turbo passes it through to `test` (turbo.json), so it is named here.
  server-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://taverns:taverns@127.0.0.1:5433/taverns

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taverns
          POSTGRES_PASSWORD: taverns
          POSTGRES_DB: taverns
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taverns -d taverns"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the server
        run: pnpm turbo run test --filter=server

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the web app and the shared packages
        run: pnpm turbo run test --filter=web --filter=@taverns/ui --filter=@taverns/api

  # The web Playwright suites (`apps/web/e2e/README.md`). The layout suite is
  # Chromium over the fixture maps and needs neither Postgres nor the server;
  # the authenticated suite signs in through Clerk against the real server, on
  # a database of its own it creates in this Postgres and drops afterwards.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taverns
          POSTGRES_PASSWORD: taverns
          POSTGRES_DB: taverns
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taverns -d taverns"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm -F web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm -F web exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm -F web exec playwright install-deps chromium

      - name: Run the Playwright suite
        id: layout
        run: pnpm -F web e2e

      # A fork's pull request gets no repository secrets, so there the suite is
      # skipped with a notice rather than failed. GitHub masks both values in
      # the log; the suite never prints them and writes no traces.
      - name: Run the authenticated Playwright suite
        id: auth
        if: ${{ !cancelled() }}
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$CLERK_PUBLISHABLE_KEY" ] || [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::notice title=Authenticated e2e skipped::CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY are not available to this run (a fork's pull request?), so the authenticated Playwright suite did not run."
            exit 0
          fi
          pnpm -F web e2e:auth

      - name: Upload the report and traces
        if: ${{ failure() && steps.layout.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

      # Screenshots, page snapshots and the stack's server and Vite logs; the
      # suite records no traces, since a trace would carry the testing token.
      - name: Upload the authenticated report
        if: ${{ failure() && steps.auth.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: |
            apps/web/playwright-report-auth
            apps/web/test-results-auth
          retention-days: 14
