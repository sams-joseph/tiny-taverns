<!-- @dsCard group="Colors" viewport="700x160" name="Semantic aliases in use" subtitle="Reach for the alias, not the ramp step." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:16px 18px;background:var(--surface-page)}.lbl{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}.mono{font:var(--type-stat);color:var(--text-muted)}.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-sm)}.dot{width:22px;height:22px;border-radius:var(--r-xs);border:1px solid rgba(11,18,26,.12);flex:0 0 auto}.t{font:var(--fw-medium) var(--fs-caption)/1.3 var(--font-mono);color:var(--text-body)}</style>
</head><body><div class="rows"><div class="r"><span class="dot" style="background:var(--accent)"></span><span class="t">--accent</span></div><div class="r"><span class="dot" style="background:var(--danger)"></span><span class="t">--danger</span></div><div class="r"><span class="dot" style="background:var(--success)"></span><span class="t">--success</span></div><div class="r"><span class="dot" style="background:var(--magic)"></span><span class="t">--magic</span></div><div class="r"><span class="dot" style="background:var(--info)"></span><span class="t">--info</span></div><div class="r"><span class="dot" style="background:var(--surface-panel)"></span><span class="t">--surface-panel</span></div><div class="r"><span class="dot" style="background:var(--text-body)"></span><span class="t">--text-body</span></div><div class="r"><span class="dot" style="background:var(--border-hairline)"></span><span class="t">--border-hairline</span></div></div></body></html>
