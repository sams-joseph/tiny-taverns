<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:20px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.row{display:flex;gap:16px}.s{flex:1;height:132px;border-radius:var(--r-card);padding:13px;font:var(--fw-medium) 12px/1.6 var(--font-sans);border:1px solid var(--border-hairline)}</style>
</head><body><div class="row">
  <div class="s" style="background:var(--surface-sunken);color:var(--text-muted)">--surface-sunken<br><span style="font-weight:400;color:var(--text-faint)">#06090D · wells, footers</span></div>
  <div class="s" style="background:var(--surface-page);color:var(--text-muted)">--surface-page<br><span style="font-weight:400;color:var(--text-faint)">slate-950 · the app body</span></div>
  <div class="s" style="background:var(--surface-card);box-shadow:var(--shadow-1);color:var(--text-muted)">--surface-card<br><span style="font-weight:400;color:var(--text-faint)">slate-900 · cards, panels</span></div>
  <div class="s" style="background:var(--surface-raised);box-shadow:var(--shadow-2);color:var(--text-muted)">--surface-raised<br><span style="font-weight:400;color:var(--text-faint)">slate-800 · popovers, toasts</span></div>
</div>
<div class="mono" style="margin-top:12px">Depth is surface lightness + a black shadow. --mist / --frost stay defined but are never page or card fills.</div></body></html>
