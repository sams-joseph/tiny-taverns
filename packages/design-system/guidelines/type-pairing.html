<!-- @dsCard group="Type" viewport="700x200" name="Pairing in place" subtitle="Sans for structure, mono for numbers, serif italic for the one thing a DM reads aloud." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:20px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.cap{font:var(--fw-regular) 12px/1.4 var(--font-sans);color:var(--text-faint);margin-top:8px}</style>
</head><body><div style="background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:20px;max-width:480px">
  <div style="font:var(--type-title);letter-spacing:var(--ls-tight);color:var(--text-heading)">Goblin Boss</div>
  <div style="font:var(--fw-regular) var(--fs-body-s)/1.5 var(--font-sans);color:var(--text-muted);margin-top:3px">Small humanoid (goblinoid), neutral evil</div>
  <div style="height:1px;background:var(--border-hairline);margin:14px 0"></div>
  <div style="display:flex;gap:18px;font:var(--type-stat);color:var(--text-body)"><span>AC 17</span><span>21 hp (6d6)</span><span>30 ft.</span><span>CR 1</span></div>
  <div style="margin-top:14px;padding-left:12px;border-left:3px solid var(--verdigris-300)">
    <p style="margin:0;font:var(--type-read-aloud);font-size:15px;color:var(--slate-300)">He is wearing three cloaks, none of them his.</p>
  </div>
</div>
<div class="mono" style="margin-top:12px">Instrument Sans &middot; JetBrains Mono &middot; Alegreya italic</div></body></html>
