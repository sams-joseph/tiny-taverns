<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:20px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.sw{display:flex;gap:8px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.10)}.n{font:var(--fw-medium) 12px/1.2 var(--font-sans);color:var(--text-body)}.v{font:var(--fw-regular) 11px/1.2 var(--font-mono);color:var(--text-faint)}</style>
</head><body><div class="sw">
  <div class="s"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">raised</div><div class="v">#1A2330</div></div><div class="s"><div class="chip" style="background:var(--surface-card)"></div><div class="n">card</div><div class="v">#111820</div></div><div class="s"><div class="chip" style="background:var(--surface-page)"></div><div class="n">page</div><div class="v">#0A0E13</div></div><div class="s"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">sunken</div><div class="v">#06090D</div></div>
  <div class="s"><div class="chip" style="background:var(--mist);opacity:.35"></div><div class="n">mist</div><div class="v">unused as fill</div></div>
  <div class="s"><div class="chip" style="background:var(--frost);opacity:.35"></div><div class="n">frost</div><div class="v">unused as fill</div></div>
</div></body></html>
