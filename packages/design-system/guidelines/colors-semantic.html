<!-- @dsCard group="Colors" viewport="700x160" name="Semantic families" subtitle="Vivid and unmistakable at a glance: crimson = damage · emerald = healing · violet = magic · azure = rules" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:16px 18px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.sw{display:flex;gap:8px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.10);box-shadow:var(--shadow-1)}.n{font:var(--fw-bold) var(--fs-caption)/1.2 var(--font-sans);color:var(--text-body)}.v{font:var(--fw-regular) 11px/1.2 var(--font-mono);color:var(--text-faint)}.pair{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stackrow{display:flex;gap:0;box-shadow:var(--shadow-1)}.stackrow div{flex:1;height:52px}.stackrow div:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}.stackrow div:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}</style>
</head><body><div class="pair">
  <div class="s"><div class="stackrow"><div style="background:var(--crimson-700)"></div><div style="background:var(--crimson-600)"></div><div style="background:var(--crimson-500)"></div><div style="background:var(--crimson-400)"></div><div style="background:var(--crimson-200)"></div><div style="background:var(--crimson-100)"></div></div><div class="n">Crimson · damage</div><div class="v">--crimson-700 → 100</div></div><div class="s"><div class="stackrow"><div style="background:var(--emerald-700)"></div><div style="background:var(--emerald-600)"></div><div style="background:var(--emerald-500)"></div><div style="background:var(--emerald-400)"></div><div style="background:var(--emerald-200)"></div><div style="background:var(--emerald-100)"></div></div><div class="n">Emerald · healing</div><div class="v">--emerald-700 → 100</div></div><div class="s"><div class="stackrow"><div style="background:var(--violet-700)"></div><div style="background:var(--violet-600)"></div><div style="background:var(--violet-500)"></div><div style="background:var(--violet-400)"></div><div style="background:var(--violet-200)"></div><div style="background:var(--violet-100)"></div></div><div class="n">Violet · magic</div><div class="v">--violet-700 → 100</div></div><div class="s"><div class="stackrow"><div style="background:var(--azure-700)"></div><div style="background:var(--azure-600)"></div><div style="background:var(--azure-500)"></div><div style="background:var(--azure-400)"></div><div style="background:var(--azure-200)"></div><div style="background:var(--azure-100)"></div></div><div class="n">Azure · rules</div><div class="v">--azure-700 → 100</div></div>
</div>
<div class="mono" style="margin-top:12px">The 500 step is the alias (--danger / --success / --magic / --info) · 100 tints backgrounds · 700 sets text on those tints</div></body></html>
