<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<style>body{padding:16px 18px;background:var(--surface-page)}.lbl{font:var(--type-label);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}.mono{font:var(--type-stat);color:var(--text-muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{padding:9px 10px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-sm);font:var(--type-stat);color:var(--text-body)}kbd{padding:2px 6px;border-radius:3px;background:var(--slate-100);border:1px solid var(--border-hairline);font:var(--fw-medium) var(--fs-micro)/1.4 var(--font-mono)}</style>

</div>
