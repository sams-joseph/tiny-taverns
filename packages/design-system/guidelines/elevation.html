<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>body{padding:20px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.cap{font:var(--fw-regular) 12px/1.4 var(--font-sans);color:var(--text-faint);margin-top:8px}.row{display:flex;gap:22px}.box{flex:1;height:92px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-lg);display:flex;align-items:flex-end;padding:11px;font:var(--fw-medium) 11px/1.5 var(--font-sans);color:var(--text-muted)}</style>
</head><body><div class="row">
