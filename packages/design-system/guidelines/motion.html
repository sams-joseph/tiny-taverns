<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:20px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.cap{font:var(--fw-regular) 12px/1.4 var(--font-sans);color:var(--text-faint);margin-top:8px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.c{padding:12px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--r-md);box-shadow:var(--shadow-1)}.d{font:var(--fw-semibold) 20px/1 var(--font-display);letter-spacing:var(--ls-display);color:var(--text-heading)}.k{font:var(--fw-regular) 11px/1.5 var(--font-mono);color:var(--text-faint);margin-top:7px}.n{font:var(--fw-regular) 12px/1.35 var(--font-sans);color:var(--text-muted);margin-top:2px}</style>
</head><body><div class="g">
  <div class="c"><div class="d">80ms</div><div class="k">--dur-instant</div><div class="n">Press</div></div>
  <div class="c"><div class="d">140ms</div><div class="k">--dur-fast</div><div class="n">Hover, focus</div></div>
  <div class="c"><div class="d">200ms</div><div class="k">--dur-base</div><div class="n">Dialog, toast</div></div>
  <div class="c"><div class="d">280ms</div><div class="k">--dur-slow</div><div class="n">Panels</div></div>
  <div class="c"><div class="d">400ms</div><div class="k">--dur-slower</div><div class="n">Page transitions</div></div>
</div>
<div class="k" style="margin-top:14px">--ease-out cubic-bezier(.16,1,.3,1) &nbsp;·&nbsp; --ease-in-out cubic-bezier(.4,0,.2,1) &nbsp;·&nbsp; reduced-motion zeroes every duration</div></body></html>
