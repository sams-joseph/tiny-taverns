<!-- @dsCard group="Brand" viewport="700x190" name="Interaction states" subtitle="Hover shifts the fill one step; press adds a subtle inset. No transforms, no bounce." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>body{padding:20px;background:var(--surface-page)}.mono{font:var(--type-stat);color:var(--text-muted)}.cap{font:var(--fw-regular) 12px/1.4 var(--font-sans);color:var(--text-faint);margin-top:8px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.btn{height:38px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:var(--r-control);background:var(--accent);color:var(--text-on-accent);font:var(--fw-medium) 13px/1 var(--font-sans);box-shadow:var(--shadow-1)}</style>
</head><body><div class="g">
  <div><div class="btn">Rest</div><div class="cap" style="text-align:center">--accent</div></div>
  <div><div class="btn" style="background:var(--accent-hover)">Hover</div><div class="cap" style="text-align:center">--accent-hover</div></div>
  <div><div class="btn" style="background:var(--accent-press);box-shadow:var(--shadow-inset-press)">Press</div><div class="cap" style="text-align:center">--accent-press + inset</div></div>
  <div><div class="btn" style="box-shadow:var(--ring)">Focus</div><div class="cap" style="text-align:center">--ring, 2px offset</div></div>
</div>
<div class="g" style="margin-top:18px">
  <div><div class="btn" style="background:var(--surface-card);color:var(--text-body);border-color:var(--border-strong)">Secondary</div><div class="cap" style="text-align:center">hairline border</div></div>
  <div><div class="btn" style="background:var(--danger);color:var(--text-on-solid)">Destructive</div><div class="cap" style="text-align:center">--danger</div></div>
  <div><div class="btn" style="background:transparent;color:var(--text-body);box-shadow:none">Ghost</div><div class="cap" style="text-align:center">no shadow</div></div>
  <div><div class="btn" style="opacity:.5">Disabled</div><div class="cap" style="text-align:center">opacity .5</div></div>
</div></body></html>
