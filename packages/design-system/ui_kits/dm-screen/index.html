<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tiny Taverns — DM screen</title>
<link rel="icon" type="image/png" href="../../assets/icon/favicon-32.png">
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body><div id="root"></div>
<script src="data.js"></script>
<script src="chronicle-data.js"></script>
<script src="chat-data.js"></script>
<script src="player-data.js"></script>
<script type="text/babel" src="ChatParts.jsx"></script>
<script type="text/babel" src="ChatPanel.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="StatBlock.jsx"></script>
<script type="text/babel" src="CampaignHome.jsx"></script>
<script type="text/babel" src="EncounterRunner.jsx"></script>
<script type="text/babel" src="Bestiary.jsx"></script>
<script type="text/babel" src="Chronicle.jsx"></script>
<script type="text/babel" src="Party.jsx"></script>
<script type="text/babel" src="PlayerParts.jsx"></script>
<script type="text/babel" src="MyCharacters.jsx"></script>
<script type="text/babel" src="CharacterSheet.jsx"></script>
<script type="text/babel" src="CharacterCreate.jsx"></script>
<script type="text/babel" src="PlayerTable.jsx"></script>
<script type="text/babel">
const DM_HOME = "home", PLAYER_HOME = "characters";

function App() {
  const [role, setRoleRaw] = React.useState("dm");
  const [screen, setScreen] = React.useState(DM_HOME);
  const setRole = (r) => { setRoleRaw(r); setScreen(r === "dm" ? DM_HOME : PLAYER_HOME); };

  /* Character sheet and creation live under Characters in the nav. */
  const navScreen = screen === "sheet" || screen === "create" ? "characters" : screen;

  const dm =
    screen === "home" ? <CampaignHome onRun={() => setScreen("run")} />
    : screen === "party" ? <Party onChronicle={() => setScreen("chronicle")} />
    : screen === "run" ? <EncounterRunner onExit={() => setScreen("home")} />
    : screen === "bestiary" ? <Bestiary onRun={() => setScreen("run")} />
    : <Chronicle />;

  const player =
    screen === "characters" ? <MyCharacters onOpen={() => setScreen("sheet")} onCreate={() => setScreen("create")} onTable={() => setScreen("table")} />
    : screen === "sheet" ? <CharacterSheet onTable={() => setScreen("table")} onBack={() => setScreen("characters")} />
    : screen === "create" ? <CharacterCreate onDone={() => setScreen("characters")} onCancel={() => setScreen("characters")} />
    : screen === "table" ? <PlayerTable onLeave={() => setScreen("sheet")} />
    : <Chronicle />;

  return (
    <AppShell screen={navScreen} setScreen={setScreen} role={role} setRole={setRole}>
      {role === "dm" ? dm : player}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
