# Taverns: the gate runs the checks CI runs (.github/workflows/ci.yml), in
# databases it owns on the development Postgres server. Neither runs the
# Playwright suites (`pnpm -F web e2e`, `e2e:auth`); they are run by hand.
# no-mistakes reads `commands` from the default branch's copy of this file only.
commands:
  prepare: pnpm install --frozen-lockfile
  lint: pnpm turbo run lint typecheck && pnpm format:check
  # scripts/with-private-postgres.sh needs the compose Postgres running
  # (`pnpm db:up`). It creates a throwaway database there, runs its arguments
  # with DATABASE_URL pointed at it and the server suite's per-file databases
  # named under it, then drops them all. turbo.json passes DATABASE_URL and
  # TAVERNS_TEST_DATABASE_PREFIX through to `test`.
  test: scripts/with-private-postgres.sh sh -c 'pnpm turbo run build test --continue'

test:
  instructions: |
    Databases: the development Postgres server on 127.0.0.1:5433 may be used only
    through scripts/with-private-postgres.sh, and never its `taverns` database,
    which is the maintainer's (a past gate run wrote an account into it). Every
    server command (tests, `pnpm -F server token:issue`, `migrate`, the importers,
    `tsx src/main.ts`) must run under the script, which creates a throwaway
    database, sets DATABASE_URL to it and drops it afterwards; never rely on the
    default in apps/server/src/Config.ts, which is the `taverns` database. Run each
    command inside one invocation of the script, since the database is gone when
    it exits. If the script says the server is not reachable, report that; never
    start, stop or reset it (`pnpm db:up`, `db:down`, `db:reset`,
    `db:reset:fresh`), and never connect to 5433 any other way.
    Ports: 3000 and 5173 belong to the maintainer's running `pnpm dev`. Never use,
    probe or stop those servers. Use free ports only, and never stop a process
    you did not start (no pkill, no killall, no kill by name or pattern). Stop only
    PIDs you recorded at spawn.
    Models: never call a real model or image API. Leave HOB_API_URL, HOB_MODEL and
    PORTRAIT_API_URL unset, or point them at the test suite's scripted stubs.
    Clerk: never create, change or delete a Clerk user; sign in only as the two
    existing `+clerk_test` users the way `pnpm -F web e2e:auth` does. Never
    run the Playwright suites (`pnpm -F web e2e`, `e2e:auth`); they are run by hand.
    Scratch: write every temporary file, log and data directory under the run
    worktree's .scratch/, which git ignores: never /tmp (a uid-wide quota there
    has filled during a server suite run), and never anywhere else in the
    worktree, where a later step can commit it (a gate run once shipped a
    root-level .s4.tmp that way).
